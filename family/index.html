<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rakshabandhan Family Surprise 💖</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Patrick+Hand&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #1e1e24;
      font-family: 'Fredoka', cursive, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #fffdf9;
      background-image: radial-gradient(#ffbe76 2px, transparent 2px);
      background-size: 24px 24px;
      border: 6px solid #eb4d4b;
      border-radius: 24px;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
    }
    .hero-img { width: 130px; height: 130px; object-fit: contain; margin-bottom: 10px; }
    h1 { font-family: 'Patrick Hand', cursive; color: #b33939; font-size: 2.2rem; margin-bottom: 6px; }
    p { color: #57606f; font-size: 1rem; margin-bottom: 24px; }
    .links-list { display: flex; flex-direction: column; gap: 14px; }
    .link-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: #fff;
      border: 2px solid #ff4757;
      border-radius: 16px;
      color: #2f3542;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 700;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 4px 10px rgba(235, 77, 75, 0.1);
    }
    .link-btn:hover {
      transform: translateY(-4px) scale(1.02);
      background: #eb4d4b;
      color: #fff;
      box-shadow: 0 8px 18px rgba(235, 77, 75, 0.3);
    }
    .tag { font-size: 0.85rem; background: #ffeaa7; color: #d35400; padding: 4px 8px; border-radius: 8px; }
    .link-btn:hover .tag { background: #fff; color: #eb4d4b; }
  </style>
</head>
<body>
  <div class="card">
    <img src="../guddu/assets/love.gif" alt="Shinchan" class="hero-img" onerror="this.src='https://media.giphy.com/media/xT0xeJpnrWC4XWblEk/giphy.gif'" />
    <h1>Family Rakhi Special 🌸</h1>
    <p>Tap your name to unlock your personalized card!</p>

    <div class="links-list">
      <a href="../prachi/" class="link-btn">
        <span>👑 Prachi Di</span>
        <span class="tag">Open 🎁</span>
      </a>
      <a href="../guddu/" class="link-btn">
        <span>🛍️ Guddu Di</span>
        <span class="tag">Open 🎁</span>
      </a>
      <a href="../shanaya/" class="link-btn">
        <span>👧 Shanaya</span>
        <span class="tag">Open 🎁</span>
      </a>
    </div>
  </div>
</body>
</html>
